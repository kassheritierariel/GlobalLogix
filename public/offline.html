<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#007FFF" />
  <title>GlobalLogix — Hors connexion</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#007fff,#003f87);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#062b5c;padding:24px}.card{width:min(100%,430px);background:#fff;border-radius:28px;padding:32px;text-align:center;box-shadow:0 24px 60px rgba(0,31,73,.28)}.mark{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:#f7d116;display:grid;place-items:center;font-size:34px;font-weight:900}.eyebrow{color:#007fff;font-size:12px;font-weight:900;letter-spacing:1.4px}.title{font-size:27px;margin:8px 0}.copy{color:#5b6d84;line-height:1.6}.button{display:inline-block;margin-top:18px;padding:13px 20px;border-radius:14px;background:#007fff;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">G</div>
    <div class="eyebrow">GLOBALLOGIX</div>
    <h1 class="title">Connexion indisponible</h1>
    <p class="copy">Vérifiez votre accès Internet pour synchroniser les expéditions et recevoir les dernières mises à jour.</p>
    <a class="button" href="/">Réessayer</a>
  </main>
</body>
</html>
